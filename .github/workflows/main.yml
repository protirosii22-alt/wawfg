yaml
name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole fortnite_control_panel_v2.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ControlPanel-EXE
          path: dist/fortnite_control_panel_v2.exe
